[package]
name = "archivar-cli"
description = "The archivar command line"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "archivar"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
archivar-store = { path = "../store" }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
uuid = "1.26.1"
